name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install NPM dependencies
        run: npm install

      - name: Setup Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13846066"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> $GITHUB_ENV

      - name: Tauri Android Build Debug
        run: |
          npm run tauri android init
          npx tauri android build --debug --apk

      - name: Tauri Android Build Release
        run: |
          npx tauri android build --apk

      - name: Self-Sign Release APKs
        run: |
          # Generate a keystore on the fly for self-signing
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias release -storepass password -keypass password -dname "CN=Cetak, OU=Cerdas, O=Cerdas Club, L=Jakarta, S=Jakarta, C=ID"
          
          # Find latest build-tools for apksigner
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)/apksigner
          
          # Sign all unsigned APKs
          shopt -s globstar
          for apk in src-tauri/gen/android/app/build/outputs/apk/**/*.apk; do
            if [[ "$apk" == *"-unsigned.apk" ]]; then
              signed_apk="${apk/-unsigned.apk/-signed.apk}"
              $APKSIGNER sign --ks release.jks --ks-pass pass:password --ks-key-alias release --key-pass pass:password --out "$signed_apk" "$apk"
              rm "$apk"
            fi
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          tag_name: "${{ github.ref_name }}"
          name: "Release ${{ github.ref_name }}"
          body: "Automated Android APK build from tag ${{ github.ref_name }}. Includes Debug and Release (Self-Signed) split by ABI for smaller size."
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
